version: 2
updates:
  # Dependabot checks the digests of the two base images once a month, in one
  # group. After its PR merges, a release tag with -N, such as 5.130.6-2,
  # ships the update.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "America/New_York"
    groups:
      docker:
        patterns:
          - "*"
    # A new Node major is a Ghost migration, not a base-image fix.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - ":game_die: dependencies"
      - ":robot: bot"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "America/New_York"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - ":game_die: dependencies"
      - ":robot: bot"
