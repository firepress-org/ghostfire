version: 2
updates:
  # One grouped PR a month bumps the digests of the two base images. After it
  # merges, a release tag with -N ships the fix, such as 5.130.6-2.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "America/New_York"
    groups:
      docker:
        patterns:
          - "*"
    # A new Node major is a Ghost migration, not a base-image fix.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - ":game_die: dependencies"
      - ":robot: bot"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "America/New_York"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - ":game_die: dependencies"
      - ":robot: bot"
